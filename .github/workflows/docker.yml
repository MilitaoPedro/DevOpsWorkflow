name: Docker Build and Push

# Dispara automaticamente a cada push na branch principal do projeto.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Nome da imagem no registry. Ajuste o owner caso o repositorio mude de dono.
  IMAGE_NAME: ghcr.io/militaopedro/devopsworkflow

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Definir a tag da imagem
        id: vars
        run: |
          # A tag da imagem e derivada do arquivo VERSION do repositorio.
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Tag da imagem: ${VERSION}"

      - name: Configurar o Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # As credenciais vem dos mecanismos de Secrets do GitHub Actions e
          # nunca ficam escritas no arquivo da pipeline.
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build da imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verificar se a imagem foi criada
        run: |
          docker image inspect ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.version }} \
            --format 'Imagem criada: {{.RepoTags}} ({{.Size}} bytes)'

      - name: Testar o container antes do push
        run: |
          docker run -d --name app-test -p 8080:8080 \
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.version }}
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/hello; then
              echo ""
              echo "Endpoint respondendo corretamente."
              exit 0
            fi
            sleep 1
          done
          echo "O endpoint nao respondeu dentro do tempo esperado."
          docker logs app-test
          exit 1

      - name: Encerrar o container de teste
        if: always()
        run: docker stop app-test && docker rm app-test

      - name: Push da imagem para o registry
        run: docker push ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.version }}
