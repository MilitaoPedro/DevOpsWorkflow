name: DevSecOps Security Checks

# Executa automaticamente na abertura e atualizacao de Pull Requests e em
# pushes para a branch principal.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# As actions de terceiros sao fixadas pelo commit SHA (e nao por tag movel)
# para evitar que uma tag reescrita introduza codigo malicioso no pipeline.
# A versao correspondente esta indicada em comentario ao lado de cada uma.

jobs:
  # -------------------------------------------------------------------------
  # Requisito 1 - Gitleaks: deteccao de segredos no historico do repositorio.
  # Bloqueante: falha quando encontra senhas, tokens ou chaves.
  # -------------------------------------------------------------------------
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo (historico completo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Varredura de segredos com Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE e exigida apenas para contas de organizacao.
          # Este repositorio pertence a uma conta pessoal, entao nao e necessaria.
          GITLEAKS_CONFIG: .gitleaks.toml

  # -------------------------------------------------------------------------
  # Requisito 2 - SonarCloud: analise estatica (SAST) com Quality Gate.
  # Bloqueante: sonar.qualitygate.wait=true faz o job falhar quando o
  # Quality Gate (codigo novo) nao e atendido.
  # -------------------------------------------------------------------------
  sonarcloud:
    name: sonarcloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo (historico completo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historico completo e recomendado para melhorar a relevancia da
          # analise de "codigo novo" do SonarCloud.
          fetch-depth: 0

      - name: Analise SonarCloud
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          # Token da conta SonarCloud, guardado nos Secrets do repositorio.
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Le organization, projectKey e qualitygate.wait de
          # sonar-project.properties.
          args: >
            -Dsonar.qualitygate.wait=true

  # -------------------------------------------------------------------------
  # Requisito 3 - Trivy: dependencias do projeto e imagem Docker.
  # Bloqueante para CRITICAL e HIGH com correcao disponivel.
  # LOW e MEDIUM sao registrados em relatorio, sem bloquear.
  # -------------------------------------------------------------------------
  trivy:
    name: trivy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --- Dependencias do projeto -----------------------------------------
      - name: Trivy - dependencias (bloqueia CRITICAL/HIGH com correcao)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          # ignore-unfixed=true: bloqueia apenas o que tem correcao disponivel,
          # exatamente como pede o enunciado.
          ignore-unfixed: true
          exit-code: '1'
          format: table
          output: trivy-deps-blocking.txt

      - name: Trivy - dependencias (relatorio LOW/MEDIUM, nao bloqueia)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: LOW,MEDIUM
          exit-code: '0'
          format: table
          output: trivy-deps-report.txt

      # --- Imagem Docker ----------------------------------------------------
      - name: Build da imagem Docker para varredura
        run: docker build -t devopsworkflow:scan .

      - name: Trivy - imagem (bloqueia CRITICAL/HIGH com correcao)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: devopsworkflow:scan
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table
          output: trivy-image-blocking.txt

      - name: Trivy - imagem (relatorio LOW/MEDIUM, nao bloqueia)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: devopsworkflow:scan
          scanners: vuln
          severity: LOW,MEDIUM
          exit-code: '0'
          format: table
          output: trivy-image-report.txt

      - name: Publicar relatorios do Trivy
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-reports
          path: trivy-*.txt
          if-no-files-found: warn

  # -------------------------------------------------------------------------
  # Requisito 4 - Syft: SBOM da imagem Docker, publicado como artifact.
  # -------------------------------------------------------------------------
  sbom:
    name: sbom
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build da imagem Docker para o SBOM
        run: docker build -t devopsworkflow:sbom .

      - name: Gerar SBOM com Syft (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: devopsworkflow:sbom
          format: cyclonedx-json
          output-file: sbom-image.cdx.json
          artifact-name: sbom-image
          # O artifact e publicado explicitamente no passo seguinte, para
          # manter o mesmo padrao em ambos os formatos.
          upload-artifact: false

      - name: Gerar SBOM com Syft (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: devopsworkflow:sbom
          format: spdx-json
          output-file: sbom-image.spdx.json
          upload-artifact: false

      - name: Publicar SBOM como artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-image
          path: |
            sbom-image.cdx.json
            sbom-image.spdx.json
          if-no-files-found: error
          retention-days: 30

  # -------------------------------------------------------------------------
  # Publicacao da imagem no registry.
  #
  # Depende do sucesso das verificacoes obrigatorias: se Gitleaks, SonarCloud
  # ou Trivy falharem, este job nao executa e a imagem NAO e publicada.
  # -------------------------------------------------------------------------
  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: [gitleaks, sonarcloud, trivy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Definir a tag da imagem
        id: vars
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Configurar o Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login no GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build da imagem Docker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ghcr.io/militaopedro/devopsworkflow:${{ steps.vars.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Testar o container antes do push
        run: |
          docker run -d --name app-test -p 8080:8080 \
            ghcr.io/militaopedro/devopsworkflow:${{ steps.vars.outputs.version }}
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/hello; then
              echo ""
              echo "Endpoint respondendo corretamente."
              exit 0
            fi
            sleep 1
          done
          echo "O endpoint nao respondeu dentro do tempo esperado."
          docker logs app-test
          exit 1

      - name: Encerrar o container de teste
        if: always()
        run: docker stop app-test && docker rm app-test

      - name: Push da imagem para o registry
        run: docker push ghcr.io/militaopedro/devopsworkflow:${{ steps.vars.outputs.version }}
