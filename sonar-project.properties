# ---------------------------------------------------------------------------
# Configuracao do SonarCloud.
#
# ATENCAO: preencha as duas propriedades marcadas com <PREENCHER> apos criar o
# projeto em https://sonarcloud.io (passo a passo no README.md, secao
# "Configuracao do SonarCloud"). Sem elas o job "sonarcloud" falha.
# ---------------------------------------------------------------------------

# Chave da organizacao no SonarCloud (ex.: militaopedro).
sonar.organization=militao-experiments

# Chave do projeto no SonarCloud. Por padrao o SonarCloud cria a chave no
# formato <organizacao>_<repositorio>, por exemplo:
#   MilitaoPedro_DevOpsWorkflow
sonar.projectKey=militao-experiments_devopsworkflow

sonar.projectName=DevOpsWorkflow

# Codigo-fonte analisado.
sonar.sources=app.js
sonar.sourceEncoding=UTF-8

# ---------------------------------------------------------------------------
# Quality Gate voltado ao codigo novo (New Code).
#
# Garante que o pipeline falhe quando o codigo introduzido nao atender aos
# criterios de seguranca e qualidade definidos. O SonarCloud usa por padrao o
# Quality Gate "Sonar way", que ja avalia apenas o codigo novo. O
# "qualitygate.wait=true" faz o scanner aguardar o resultado e retornar erro
# quando o gate falhar - e o que efetivamente bloqueia o merge.
# ---------------------------------------------------------------------------
sonar.qualitygate.wait=true
